<div class="cadastro-page">
  <div class="cadastro-card">
    <header class="card-header">
      <h2>Cadastro de Candidato</h2>
      <p class="subtitulo">Preencha manualmente ou envie um currículo em PDF para pré-preencher.</p>
    </header>

    <div class="upload-box">
      <label for="pdf-input" class="upload-label">
        <span class="upload-icon">📎</span>
        <span class="upload-text">
          <strong>Enviar currículo</strong>
          <small>PDF, opcional, até 5 MB</small>
        </span>
      </label>
      <input
        id="pdf-input"
        type="file"
        accept="application/pdf"
        (change)="onArquivoSelecionado($event)"
      />
      <span class="nome-arquivo" *ngIf="nomeArquivo">
        <span class="check">✓</span> {{ nomeArquivo }}
      </span>
    </div>

    <form #form="ngForm" (ngSubmit)="salvar(form)">
      <div class="campo">
        <label for="nomeCompleto">Nome completo <span class="obrigatorio">*</span></label>
        <input
          id="nomeCompleto"
          name="nomeCompleto"
          type="text"
          placeholder="Ex: Maria Silva Santos"
          [(ngModel)]="candidato.nomeCompleto"
          required
          minlength="3"
          #nome="ngModel"
        />
        <small class="erro" *ngIf="nome.invalid && nome.touched">
          Nome é obrigatório (mínimo 3 caracteres).
        </small>
      </div>

      <div class="campo">
        <label for="email">E-mail <span class="obrigatorio">*</span></label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="nome@exemplo.com"
          [(ngModel)]="candidato.email"
          required
          email
          #emailCampo="ngModel"
        />
        <small class="erro" *ngIf="emailCampo.invalid && emailCampo.touched">
          Informe um e-mail válido.
        </small>
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input
            id="telefone"
            name="telefone"
            type="text"
            placeholder="(11) 98765-4321"
            [(ngModel)]="candidato.telefone"
          />
        </div>

        <div class="campo">
          <label for="areaInteresse">Área / cargo de interesse</label>
          <input
            id="areaInteresse"
            name="areaInteresse"
            type="text"
            placeholder="Ex: Desenvolvedor Backend"
            [(ngModel)]="candidato.areaInteresse"
          />
        </div>
      </div>

      <div class="campo">
        <label for="resumoProfissional">Resumo profissional</label>
        <textarea
          id="resumoProfissional"
          name="resumoProfissional"
          rows="5"
          placeholder="Fale brevemente sobre sua experiência, formação e objetivos."
          [(ngModel)]="candidato.resumoProfissional"
        ></textarea>
      </div>

      <div class="acoes">
        <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando">
          {{ carregando ? 'Salvando...' : 'Salvar cadastro' }}
        </button>
        <button type="button" class="btn-secundario" (click)="limpar()" [disabled]="carregando">
          Limpar
        </button>
      </div>
    </form>

    <div class="feedback sucesso" *ngIf="mensagemSucesso">
      <span class="icone">✓</span> {{ mensagemSucesso }}
    </div>
    <div class="feedback erro" *ngIf="mensagemErro">
      <span class="icone">!</span> {{ mensagemErro }}
    </div>
  </div>
</div>
